[package]
name = "snipscreen"
version = "0.1.1"
edition = "2021"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
png = "0.18"
raw-window-handle = "0.6"
# Text marks: glyph outlines and their rasteriser, pinned to the versions epaint 0.37 already builds.
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
vello_cpu = { version = "=0.2.0", default-features = false, features = ["std", "u8_pipeline"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
