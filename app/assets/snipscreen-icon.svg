<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SnipScreen</title>
  <desc id="desc">Snip selection corners around a captured picture whose sun is a copper recording dot, on a rounded matte navy tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263C56"/>
      <stop offset="1" stop-color="#152235"/>
    </linearGradient>
  </defs>

  <!-- Tile: matte navy-500 to the slate-navy rail, with a navy-400 rim that
       keeps its edge on dark taskbars. No sheen or glow: the system is matte. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="72" y="72" width="880" height="880" rx="192" fill="none" stroke="#8CA8CF" stroke-opacity="0.45" stroke-width="16"/>

  <!-- Capture: the snipped picture, two hills in navy-300. -->
  <path d="M316 652 L444 528 Q464 508 484 528 L548 592 L592 548 Q612 528 632 548 L708 652 Z" fill="#ADC1DC" stroke="#ADC1DC" stroke-width="24" stroke-linejoin="round"/>
  <!-- Selection: the four snip corners, flat text ink. -->
  <path d="M212 380 V316 Q212 288 240 288 H304 M720 288 H784 Q812 288 812 316 V380 M812 644 V708 Q812 736 784 736 H720 M304 736 H240 Q212 736 212 708 V644" fill="none" stroke="#F2EFE9" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Recording: the one copper accent, the picture's sun and the record dot,
       separated from the tile by a navy ring. -->
  <circle cx="392" cy="420" r="64" fill="#E6A05A" stroke="#152235" stroke-width="24"/>
</svg>
